[bar.main]
auto_hide = false
background_opacity = 0.93000000000000005
capsule = false
center = ["spacer", "clock", "spacer", "weather", "spacer"]
end = [
  "tray",
  "notifications",
  "network",
  "bluetooth",
  "volume",
  "brightness",
  "battery",
  "control-center",
  "session",
]
font_scale = 1.0
margin_edge = 4
margin_ends = 4
padding = 8
position = "top"
radius = 12
reserve_space = true
shadow = false
start = [
  "launcher",
  "cpu-usage",
  "cpu-temp",
  "workspaces",
  "spacer",
  "media",
  "spacer",
]
thickness = 32
widget_spacing = 6

[bluetooth]
connect_when_enabled = true

[calendar]

[control_center.calendar]
show_events_card = false

[control_center.media]
show_visualizer = false

[dock]
enabled = false

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@HDMI-A-1"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
box_height = 196.0
box_width = 810.0
cx = 960.0
cy = 898.0
output = "HDMI-A-1"
placement_height = 1080.0
placement_width = 1920.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
background_color = "surface_container"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_media_controls = true
show_password_reveal = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[osd.kinds]
media = false

[shell]
corner_radius_scale = 1.0
date_format = "%a, %b %d"
font_family = "JetBrainsMono Nerd Font"
telemetry_enabled = false
time_format = "{:%H:%M}"

[shell.launcher]
categories = true
compact = false
layout = "simple"
sort_by_usage = true

[shell.panel]
control_center_placement = "attached"
launcher_placement = "floating"
launcher_position = "center"
session_placement = "attached"
wallpaper_placement = "attached"

[shell.session]
grid = false
show_shortcuts = true

[[shell.session.actions]]
action = "logout"
enabled = true
shortcut = "1"

[[shell.session.actions]]
action = "reboot"
enabled = true
shortcut = "2"

[[shell.session.actions]]
action = "shutdown"
enabled = true
shortcut = "3"
variant = "destructive"

[theme]
builtin = "Gruvbox"
mode = "dark"
source = "builtin"

[wallpaper]
directory = "/home/copperplate/Pictures/Wallpapers"
edge_smoothness = 0.050000000000000003
enabled = true
fill_color = "#000000"
fill_mode = "crop"
sync_transitions = true
transition_duration = 1500
transition_on_startup = false

[wallpaper.automation]
enabled = false
interval_seconds = 300
order = "random"
recursive = true

[wallpaper.default]
path = "/home/copperplate/Pictures/Wallpapers/mustacho.png"

[weather]
effects = true
enabled = true
unit = "celsius"

[widget.battery]
device = "BAT0"
display_mode = "glyph"
label_content = "percent"
show_label = true
type = "battery"

[widget.clock]
anchor = true
format = "{:%d.%m.%Y - %H:%M}"
type = "clock"

[widget.cpu-temp]
show_value = true
stat = "cpu_temp"
type = "sysmon"

[widget.cpu-usage]
show_value = true
stat = "cpu_usage"
type = "sysmon"

[widget.media]
art_size = 24
artist_first = false
hide_when_idle = false
hide_when_no_media = true
max_length = 300
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.spacer]
expand = true

[widget.weather]
show_condition = false
