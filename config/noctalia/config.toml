# Noctalia v5 configuration, adapted from the previous v4 setup. Settings
# changed through the GUI are stored as overrides in
# ~/.local/state/noctalia/settings.toml.

[shell]
telemetry_enabled = false
font_family = "JetBrainsMono Nerd Font"
time_format = "{:%H:%M}"
date_format = "%a, %b %d"
corner_radius_scale = 1.0

[shell.panel]
launcher_placement = "floating"
launcher_position = "center"
control_center_placement = "attached"
wallpaper_placement = "attached"
session_placement = "attached"

[shell.launcher]
layout = "simple"
categories = true
compact = false
sort_by_usage = true

[wallpaper]
enabled = true
directory = "/home/copperplate/Pictures/Wallpapers"
fill_mode = "crop"
fill_color = "#000000"
transition_duration = 1500
edge_smoothness = 0.05
transition_on_startup = false
sync_transitions = true

[wallpaper.default]
path = "/home/copperplate/Pictures/Wallpapers/mustacho.png"

[wallpaper.automation]
enabled = false
interval_seconds = 300
order = "random"
recursive = true

[theme]
mode = "dark"
source = "builtin"
builtin = "Gruvbox"

[bar.main]
position = "top"
thickness = 34
background_opacity = 0.93
radius = 12
margin_ends = 4
margin_edge = 4
padding = 8
widget_spacing = 6
font_scale = 1.0
shadow = false
auto_hide = false
reserve_space = true
capsule = false
start = ["launcher", "cpu-usage", "cpu-temp", "workspaces", "spacer", "media", "spacer"]
center = ["spacer", "clock", "spacer", "weather", "spacer"]
end = ["tray", "notifications", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session"]

[widget.spacer]
expand = true

[osd.kinds]
media = false

[widget.media]
artist_first = false
art_size     = 24
hide_when_no_media = true
hide_when_idle = false
max_length = 300
title_scroll = "on_hover"

[widget.cpu-usage]
type = "sysmon"
stat = "cpu_usage"
show_value = true

[widget.cpu-temp]
type = "sysmon"
stat = "cpu_temp"
show_value = true

[widget.clock]
type = "clock"
format = "{:%d.%m.%Y - %H:%M}"
anchor = true

[widget.battery]
type = "battery"
device = "BAT0"
display_mode = "glyph"
show_label = true
label_content = "percent"

[widget.weather]
show_condition   = false

[dock]
enabled = false

[weather]
enabled = true
unit = "celsius"
effects = true

[location]
auto_locate = true

[bluetooth]
connect_when_enabled = true
