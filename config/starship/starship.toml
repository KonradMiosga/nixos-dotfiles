"$schema" = 'https://starship.rs/config-schema.json'

format = """
${custom.ssh_os}\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$conda\
$pixi\
$nix_shell\
$time\
$line_break$character"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[custom.ssh_os]
command = "printf ''"
when = 'test -n "$SSH_CONNECTION"'
style = "fg:color_orange"
format = '[$output ]($style)'

[username]
show_always = false
style_user = "fg:color_orange"
style_root = "fg:color_orange"
format = '[$user]($style)'

[hostname]
ssh_only = true
style = "fg:color_orange"
format = '[@$hostname ]($style)'

[directory]
style = "bold fg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "fg:color_aqua"
format = '[ $symbol $branch]($style)'

[git_status]
style = "fg:color_aqua"
format = '[ $all_status$ahead_behind]($style)'

[nodejs]
symbol = ""
style = "fg:color_blue"
format = '[ $symbol( $version) ]($style)'

[bun]
symbol = ""
style = "fg:color_blue"
format = '[ $symbol( $version) ]($style)'

[c]
symbol = " "
style = "fg:color_blue"
format = '[ $symbol( $version) ]($style)'

[cpp]
symbol = " "
style = "fg:color_blue"
format = '[ $symbol( $version) ]($style)'

[rust]
symbol = ""
style = "fg:color_blue"
format = '[ $symbol( $version) ]($style)'

[golang]
symbol = ""
style = "fg:color_blue"
format = '[ $symbol( $version) ]($style)'

[php]
symbol = ""
style = "fg:color_blue"
format = '[ $symbol( $version) ]($style)'

[java]
symbol = ""
style = "fg:color_blue"
format = '[ $symbol( $version) ]($style)'

[kotlin]
symbol = ""
style = "fg:color_blue"
format = '[ $symbol( $version) ]($style)'

[haskell]
symbol = ""
style = "fg:color_blue"
format = '[ $symbol( $version) ]($style)'

[python]
symbol = ""
style = "fg:color_blue"
format = '[ $symbol( $version) ]($style)'

[docker_context]
symbol = ""
style = "fg:color_bg3"
format = '[ $symbol( $context) ]($style)'

[conda]
style = "fg:color_bg3"
format = '[ $symbol( $environment) ]($style)'

[pixi]
style = "fg:color_bg3"
format = '[ $symbol( $version)( $environment) ]($style)'

[nix_shell]
symbol = ""
style = "fg:color_bg3"
format = '[ $symbol $state ]($style)'

[time]
disabled = false
time_format = "%R"
style = "dimmed fg:color_fg0"
format = '[  $time ]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:color_green)'
error_symbol = '[❯](bold fg:color_red)'
vimcmd_symbol = '[❮](bold fg:color_green)'
vimcmd_replace_one_symbol = '[❮](bold fg:color_purple)'
vimcmd_replace_symbol = '[❮](bold fg:color_purple)'
vimcmd_visual_symbol = '[❮](bold fg:color_yellow)'
